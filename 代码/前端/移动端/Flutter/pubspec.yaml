name: zhixu
description: 知序学术服务客户端与响应式管理工作台
publish_to: none
version: 0.1.0+1
environment:
  sdk: '>=3.13.7 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  http: 1.6.0
  shared_preferences: 2.5.6
  file_picker: 13.3.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0
flutter:
  uses-material-design: true
  assets:
    - Assets/shop-brand.png
    - Assets/Fonts/OFL.txt
    - Assets/Fonts/OFL-CJK.txt
  fonts:
    - family: NotoSerifTibetan
      fonts:
        - asset: Assets/Fonts/NotoSerifTibetan.ttf
    - family: NotoSansCJKsc
      fonts:
        - asset: Assets/Fonts/NotoSansCJKsc-Regular.otf
