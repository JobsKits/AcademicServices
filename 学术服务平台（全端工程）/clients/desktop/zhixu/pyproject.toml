[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "zhixu-desktop"
version = "0.1.0"
description = "知序学术服务桌面客户端"
requires-python = ">=3.10,<3.16"
dependencies = ["PySide6==6.12.0"]

[project.scripts]
zhixu = "zhixu.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
zhixu = ["assets/*"]
